<div
  class="
  w-64
  h-screen
  bg-slate-900
  text-white
  fixed
  left-0
  top-0
  p-6
  "
>

  <h1
    class="
    text-2xl
    font-bold
    mb-10
    "
  >
    TutorConnect
  </h1>

  <div class="space-y-4">

    <button
      (click)="goToDashboard()"
      class="
      w-full
      text-left
      p-3
      rounded-lg
      hover:bg-slate-700
      "
    >
      🏠 Dashboard
    </button>

    <button
      (click)="goToBooking()"
      class="
      w-full
      text-left
      p-3
      rounded-lg
      hover:bg-slate-700
      "
    >
      📅 Reservar Tutoría
    </button>

    <button
      (click)="goToTutors()"
      class="
      w-full
      text-left
      p-3
      rounded-lg
      hover:bg-slate-700
      "
    >
      👥 Tutores
    </button>

    <button
      (click)="goToHistory()"
      class="
      w-full
      text-left
      p-3
      rounded-lg
      hover:bg-slate-700
      "
    >
      📚 Historial
    </button>

    <button
      (click)="goToProfile()"
      class="
      w-full
      text-left
      p-3
      rounded-lg
      hover:bg-slate-700
      "
    >
      👤 Mi Perfil
    </button>
    <button
      (click)="logout()"
      class="
      w-full
      text-left
      p-3
      rounded-lg
      hover:bg-slate-700
      mt-6
      "
    >
      🔒 Cerrar sesión
    </button>

  </div>

</div>
